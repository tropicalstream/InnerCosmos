<text x='640' y='730' text-anchor='middle' font-family="'PingFang SC', 'Hiragino Sans GB', 'STHeiti', sans-serif" font-size='30' fill='#7BE6DC' letter-spacing='4'>实测 · 复核 · 诚实取舍</text>
