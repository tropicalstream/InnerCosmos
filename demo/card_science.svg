<rect width='1280' height='1280' fill='url(#g)'/>
<text x='640' y='496' text-anchor='middle' font-family="Futura-Bold, Futura, 'Avenir Next', Helvetica" font-weight='700' font-size='62' fill='#FFF4E8' letter-spacing='5' filter='url(#softglow)'>EVERY NUMBER IS REAL</text>
<text x='640' y='572' text-anchor='middle' font-family="'PingFang SC', 'Hiragino Sans GB', 'STHeiti', sans-serif" font-size='50' fill='#FFCF8C' letter-spacing='8'>每一个数字都经过核实</text>
